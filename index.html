<!doctype html>
<html class="no-js" lang="">
<style>
  header{

    background-color: #555555;
    font-family: Bahnschrift,serif;
    font-size: 20px;
  }
  footer{
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 30px;
    background-color: #555555;
    text-align: center;
    font-family: Bahnschrift,serif;
    font-size: 20px;
  }
  .body{
    left: 0;
    right: 0;
    background-color: #222222;
    color: #cccccc;
  }
  .body button:hover{
    cursor: pointer;
  }
  .helyek{
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    border: 2px solid white;
    border-radius: 20px;
    padding: 30px;
    margin: auto;
    font-family:Bahnschrift,serif;
    background-color: brown;
  }
  .helyek td{
    width: 100px;
    height: 100px;
    display: inline-flex;
    font-size: 20px;
    color: white;
    border: 1px solid white;
    border-radius: 10px;
    background-color: #222222;
    transition: 50ms;
    padding: 30px 50px 30px 5px;
  }
  .helyek button:active{
    background-color: #444444;
    transition: 50ms;
  }
  .rejtett{
    display: none !important;
  }
  .erleles{
    top: 200px;
    position: fixed;
    left: 0;
    background-color: brown;
    border: 4px solid white;
    border-radius: 10px;
  }
  .erleles td{
    position: relative;
    width: 150px;
    height: 150px;
    text-align: center;
    color: #888888;
    transition: 1s;
  }
  .erleles td::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("kepek/hordo_fektetett.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    filter:grayscale(40%) brightness(50%);
    z-index: 0;
    pointer-events: none;
  }
  .erleles td button {
    position: relative;
    z-index: 1;
    background-color: goldenrod;
    border: 5px #555555 solid;
    border-radius: 10px;
    font-weight: bolder;
    color: white;
    padding: 5px;
  }
  .erleles td button:hover{
    background-color: darkgoldenrod;
  }
  .erleles td.feloldva::before {
    filter: none;
  }
  .erleles td span {
    position: relative;
    z-index: 1;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 1px 1px 3px black;
  }
  .kontener{
    display: flex;
    align-items: center;
  }
  .inventory-grid{
    position: relative;
    border: 3px solid white;
    background-color: gray;
    padding: 15px;
    border-radius: 10px;
  }
  .inventory-grid[open]{
    display: grid;
    grid-template-columns: repeat(6, 70px);
    grid-template-rows: repeat(6, 100px);
    border: 3px solid white;
    background-color: gray;
    gap: 5px;
    justify-content: center;
  }
  .slot{
    width: 60px;
    height: 100px;
    background-color: brown;
    border: 1px solid white;
    border-radius: 5px;
    justify-content: center;
    text-align: center;
    align-content: center;
  }
  .invGomb img {
    width: 70px;
  }
  .bezaroGombka{
    right: 0;
    position: absolute;
  }
  .bezaroGombka:active{
     background-color: red;
   }
  .uresGomb {
    width: 70px;
    height: 110px;
    display: block;
    align-items: center;
    justify-content: center;
    object-fit: contain;
    border-radius: 10px;
    border: 3px solid black;
    background-color: #555555;
    flex-shrink: 0;
  }
  .targyDb{
    display: flex;
    justify-content: center;
    padding-left: 10px;
  }
  .helyek-grid{
    top: 200px;
    margin: 0 auto;
    display: flex;
    column-gap: 30px;
    width: fit-content;
  }
  .oszlop{
    display: flex;
    flex-direction: column;
    align-items: center;
    row-gap: 40px;

    border: 2px solid white;
    border-radius: 12px;
    padding: 15px 10px;
    background-color: #333333;
  }
  .boostGomb{
    width: 90px;
    height: 20px;
    background-color: red;
    border-radius: 4px;
    border: 3px solid dimgray;
  }
  .hely{
    display: flex;
    position: relative;
    width: 80px;
    height: 110px;
    background-color: gray;
    border: #555555 solid 4px;
    border-radius: 10px;
    margin: 0 auto;
    cursor: pointer;
    justify-content: center;
    align-items: center;
  }

  .fozes{
    background-image: url("kepek/sorfozo.png");
    width: 175px;
    height: 135px;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }
  .rekesz{
    width: 140px;
    height: 100px;
    background-color: crimson;
    border: #555555 solid 4px;
    border-radius: 10px;
    margin: 0 auto;
  }
  .eladasGomb{
    display: flex;
    width: 80px;
    height: 20px;
    background-color: white;
    border-radius: 4px;
    border: 2px solid black;
  }
  .rekeszEsGomb{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
</style>
