  .helyek td{
    width: 100px;
    height: 100px;
    display: inline-flex;
    font-size: 20px;
    color: white;

    border-radius: 10px;
    background-color: #222222;

    border-radius: 10px;

  .inventory-grid{
    display: grid;
    grid-template-columns: repeat(6, 70px);
    grid-template-rows: repeat(6, 100px);

    background-color: gray;
    gap: 5px;
    justify-content: center;
  }
  .slot{

    height: 100px;

  .bezaroGombka{

  }

     background-color: red;
   }
  .uresGomb {
    width: 70px;
    height: 110px;

    align-items: center;

    border-radius: 10px;
    border: 3px solid black;
    background-color: #555555;
    flex-shrink: 0;
  }
  .targyDb{

  }
  .helyek-grid{
    margin: 0 auto;
    display: grid;

    grid-template-rows: repeat(3, 200px);

  }
  .hely{

    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: white;
  }
