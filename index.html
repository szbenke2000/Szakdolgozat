<!doctype html>
<html class="no-js" lang="">
<style>
  header{
    background-color: #555555;
    width: auto;
    padding: 40px;
    font-family: Bahnschrift,serif;
    font-size: 20px;
  }
  .body{
    background-color: #222222;
    color: #cccccc;
  }
  .helyek{
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    border: 2px solid white;
    border-radius: 20px;
    padding: 30px;
    margin: 200px auto;
    font-family:"Goudy Stout",serif;
    background-color: brown;
  }
  .helyek button{
    font-size: 20px;
    color: white;
    border: 1px solid white;
    border-radius: 10px;
    padding: 30px;
    background-color: #222222;
    transition: 50ms;
  }
  .helyek button:active{
    background-color: #444444;
    transition: 50ms;
  }
  .hordotablazat:hover{
    background-color: #cccccc;
    color: #222222;
    transition: 150ms;
  }
  .rejtett{
    display: none !important;
  }
  .erleles{
    background-color: brown;
    border: 2px solid white;
    padding: 20px;
    border-radius: 10px;
  }
  .erleles td{
    margin: 10px;
    background-color: white;
    border: 5px solid #222222;
    padding: 20px;
    border-radius: 20px;
  }
  .kontener{
    display: flex;
    align-items: center;
  }
  .inventory-grid{
    display: grid;
    grid-template-columns: repeat(3, 70px);
    border: 3px solid white;
    background-color: #b3d4fc;
    gap: 5px;
    justify-content: center;
  }
  .slot{
    width: 60px;
    height: 100px;
    background-color: blue;
    border: 1px solid white;
    justify-content: center;
    text-align: center;
    align-content: center;
  }
</style>
